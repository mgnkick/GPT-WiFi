name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build WiFi Expert APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync Capacitor assets and plugins
        run: npx cap sync android

      - name: Install native Wi-Fi, LAN scan and ping bridge
        run: node scripts/prepare-android.mjs

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Publish APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiExpert-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

      - name: Build summary
        run: |
          echo "## WiFi Expert APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Android debug APK built successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "Download **WiFiExpert-Android-APK** from the Artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "The APK is also attached to the GitHub Release for this tag." >> "$GITHUB_STEP_SUMMARY"
          fi
